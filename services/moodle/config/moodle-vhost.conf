# Moodle 5.1+ serves only the public/ directory; config.php, admin/cli and lib/ stay outside
# the web root. Railway terminates TLS at its edge and forwards plain HTTP to port 80.
<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Slash arguments (pluginfile.php/123/...).
        AcceptPathInfo On
        DirectoryIndex index.php
        # Moodle router ($CFG->routerconfigured = true): any path that is not a real file or
        # directory goes to r.php. A rewrite (rather than FallbackResource alone) also catches
        # non-existent *.php paths, which the PHP handler would otherwise answer with 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ r.php [QSA,L]
        FallbackResource /r.php
    </Directory>

    # Never serve dot-files or developer files that might exist in the tree.
    <FilesMatch "^\.|\.(dist|lock|md|sh|ini|log|sql)$">
        Require all denied
    </FilesMatch>

    # Railway healthcheck: Apache + PHP only, no database. Apache starts after install/upgrade,
    # so a 200 here means Moodle is ready.
    Alias /healthz /usr/local/share/railway/health/healthz.php
    <Directory /usr/local/share/railway/health>
        Require all granted
        Options -Indexes
    </Directory>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/svg+xml "access plus 7 days"
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType image/jpeg "access plus 7 days"
        ExpiresByType font/woff2 "access plus 30 days"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
