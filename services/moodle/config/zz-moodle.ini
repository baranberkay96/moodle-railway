; PHP settings for Moodle on Railway. Values come from environment variables
; (defaults in the Dockerfile), so they can be changed without rebuilding.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
; Moodle refuses to install below 5000.
max_input_vars = ${PHP_MAX_INPUT_VARS}
date.timezone = ${PHP_TIMEZONE}
file_uploads = On
expose_php = Off
zend.exception_ignore_args = On
log_errors = On
error_log = /dev/stderr
display_errors = Off

; OPcache: Moodle has many PHP files; code never changes at runtime in this image.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
