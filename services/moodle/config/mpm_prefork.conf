# Prefork MPM sized for a container: each worker is one PHP process (~40-100 MB for Moodle).
# Peak RAM is roughly APACHE_MAX_REQUEST_WORKERS x PHP worker size; raise both together.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    ServerLimit              ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
